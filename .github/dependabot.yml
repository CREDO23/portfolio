version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all minor and patch bumps; majors still come one by one.
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @astrojs/check only supports TypeScript 5 and 6; remove once it supports 7.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
